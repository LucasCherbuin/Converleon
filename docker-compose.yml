# language: yaml
version: "3.8"

services:
  react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: converleon
    volumes:
      - .:/converleon
      - /converleon/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: >
      /bin/sh -c "cd /converleon &&
                  if [ ! -f package.json ]; then echo 'ERROR: package.json missing in /converleon'; ls -la /converleon; exit 1; fi &&
                  if [ ! -f node_modules/.bin/craco ]; then npm install --frozen-lockfile; fi &&
                  npm start"

volumes:
  node_modules: {}

  # docker-compose down
  # docker-compose build
  # docker-compose up -d